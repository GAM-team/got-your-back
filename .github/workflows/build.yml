name: Build and test GYB

permissions:
  id-token: write
  attestations: write
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 22 * * *'

defaults:
  run:
    shell: bash

env:
  OPENSSL_CONFIG_OPTS: no-fips --api=3.0.0 no-docs no-tls1 no-tls1_1 no-dtls no-comp no-srp no-psk no-nextprotoneg no-weak-ssl-ciphers no-idea no-seed no-camellia no-sm2 no-sm3 no-sm4 no-rc2 no-rc4 no-rc5 no-md2 no-md4 no-cast no-des no-shared -fPIC no-tests -O3
  OPENSSL_INSTALL_PATH: ${{ github.workspace }}/ssl
  OPENSSL_SOURCE_PATH: ${{ github.workspace }}/openssl
  PYTHON_INSTALL_PATH: ${{ github.workspace }}/python
  PYTHON_SOURCE_PATH: ${{ github.workspace }}/cpython
  WINDOWS_CODESIGN_CERT_HASH: F0525AB6343A5E9A5F75CF81FC56CF67E316CB28

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            jid: 1
            goal: build
            arch: x86_64
          - os: ubuntu-22.04
            jid: 2
            goal: build
            arch: x86_64
            staticx: yes
          - os: windows-11-arm
            jid: 3
            goal: build
          - os: macos-15
            jid: 4
            goal: build
            arch: aarch64
          - os: windows-2025-vs2026
            jid: 5
            goal: build
            arch: Win64
          - os: ubuntu-22.04-arm
            jid: 6
            goal: build
            arch: aarch64
          - os: ubuntu-22.04-arm
            jid: 7
            goal: build
            arch: aarch64
            staticx: yes
          - os: ubuntu-26.04
            goal: test
            python: "3.11"
            jid: 8
          - os: ubuntu-26.04
            goal: test
            python: "3.12"
            jid: 9
          - os: ubuntu-26.04
            goal: test
            python: "3.13"
            jid: 10
          - os: ubuntu-26.04
            goal: test
            python: "3.15"
            jid: 11

    steps:
      - uses: actions/checkout@master
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Cache the build
        if: matrix.goal == 'build'
        id: cache-python-ssl
        uses: actions/cache@638ed79f9dc94c1de1baef91bcab5edaa19451f4 # v4.2.4
        with:
          path: |
            cache.tar.xz
          key: ${{ matrix.jid }}-2026-04-17

      - name: Untar Cache archive
        if: matrix.goal == 'build' && steps.cache-python-ssl.outputs.cache-hit == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          tar xvvf cache.tar.xz

      - name: Use pre-compiled Python
        if: matrix.python != ''
        uses: actions/setup-python@3d1e2d2ca0a067f27da6fec484fce7f5256def85 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Set env variables for test
        if: matrix.goal == 'test'
        env:
          JID: ${{ matrix.jid }}
          ACTIONS_CACHE: ${{ steps.cache-python-ssl.outputs.cache-hit }}
          ACTIONS_GOAL: ${{ matrix.goal }}
        run: |
             export PYTHON=$(which python3)
             export gyb="${PYTHON} -m gyb"
             export gybpath="$(readlink -e .)"
             echo -e "PYTHON: ${PYTHON}\nPIP: ${PIP}\ngyb: ${gyb}\ngybpath: ${gybpath}"
             echo "PYTHON=${PYTHON}" >> $GITHUB_ENV
             echo "gyb=${gyb}" >> $GITHUB_ENV
             echo "gybpath=${gybpath}" >> $GITHUB_ENV
             echo "JID=${JID}" >> $GITHUB_ENV
             echo "ACTIONS_CACHE=${ACTIONS_CACHE}" >> $GITHUB_ENV
             echo "ACTIONS_GOAL=${ACTIONS_GOAL}" >> $GITHUB_ENV

      - name: Set Env Variables for build
        if: matrix.goal == 'build'
        env:
          arch: ${{ matrix.arch }}
          jid: ${{ matrix.jid }}
          staticx: ${{ matrix.staticx }}
        run: |
          echo "We are running on ${RUNNER_OS}"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            MAKE=make
            OS=macos
            MAKEOPT="-j$(sysctl -n hw.logicalcpu)"
            PERL=perl
            # We only care about non-deprecated OSes
            MACOSX_DEPLOYMENT_TARGET="10.15"
            echo "MACOSX_DEPLOYMENT_TARGET=${MACOSX_DEPLOYMENT_TARGET}" >> $GITHUB_ENV
            echo "PYTHON=${PYTHON_INSTALL_PATH}/bin/python3" >> $GITHUB_ENV
          elif [[ "${RUNNER_OS}" == "Linux" ]]; then
            MAKE=make
            OS=linux
            MAKEOPT="-j$(nproc)"
            PERL=perl
            echo "PYTHON=${PYTHON_INSTALL_PATH}/bin/python3" >> $GITHUB_ENV
          elif [[ "${RUNNER_OS}" == "Windows" ]]; then
            MAKE=nmake
            OS=windows
            MAKEOPT=""
            PERL="c:\strawberry\perl\bin\perl.exe"
            if [[ "${RUNNER_ARCH}" == "ARM64" ]]; then
              PYEXTERNALS_PATH="arm64"
              PYBUILDRELEASE_ARCH="ARM64"
              WIX_ARCH="arm64"
            elif [[ "${RUNNER_ARCH}" == "X64" ]]; then
              PYEXTERNALS_PATH="amd64"
              PYBUILDRELEASE_ARCH="x64"
              WIX_ARCH="x64"
            fi
            echo "PYTHON=${PYTHON_INSTALL_PATH}\python.exe" >> $GITHUB_ENV
            echo "PS_PYTHON_INSTALL_PATH=$(cygpath -w $PYTHON_INSTALL_PATH)" >> $GITHUB_ENV
            echo "PYBUILDRELEASE_ARCH=${PYBUILDRELEASE_ARCH}" >> $GITHUB_ENV
            echo "WIX_ARCH=${WIX_ARCH}" >> $GITHUB_ENV
          fi
          echo "We'll run make with: ${MAKEOPT}"
          echo "JID=${jid}" >> $GITHUB_ENV
          echo "OS=${OS}" >> $GITHUB_ENV
          echo "arch=${arch}" >> $GITHUB_ENV
          echo "staticx=${staticx}" >> $GITHUB_ENV
          echo "MAKE=${MAKE}" >> $GITHUB_ENV
          echo "MAKEOPT=${MAKEOPT}" >> $GITHUB_ENV
          echo "PERL=${PERL}" >> $GITHUB_ENV
          echo "PYEXTERNALS_PATH=${PYEXTERNALS_PATH}" >> $GITHUB_ENV
          echo "PYBUILDRELEASE_ARCH=${PYBUILDRELEASE_ARCH}" >> $GITHUB_ENV
          echo "OPENSSL_CONFIG_TARGET=${OPENSSL_CONFIG_TARGET}" >> $GITHUB_ENV
          echo "CHOC_OPS=${CHOC_OPS}" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=${OPENSSL_INSTALL_PATH}/lib:${PYTHON_INSTALL_PATH}/lib:/usr/local/lib" >> $GITHUB_ENV

      - name: MacOS import developer certificates for signing
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@11e1bb2d3771ad8ffa8459dfe527bc26b2dd4b62 # v5.0.3
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_P12 }}
          p12-password: ${{ secrets.CERTIFICATES_P12_PASSWORD }}

      - name: Get latest stable OpenSSL source
        if: matrix.goal == 'build' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/openssl/openssl.git
          cd "${OPENSSL_SOURCE_PATH}"
          export LATEST_STABLE_TAG=$(git tag --list openssl-* | grep -v alpha | grep -v beta | sort -Vr | head -n1)
          echo "Checking out version ${LATEST_STABLE_TAG}"
          git checkout "${LATEST_STABLE_TAG}"
          export COMPILED_OPENSSL_VERSION=${LATEST_STABLE_TAG:8} # Trim the openssl- prefix
          echo "COMPILED_OPENSSL_VERSION=${COMPILED_OPENSSL_VERSION}" >> $GITHUB_ENV

      - name: Windows Configure VCode
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        with:
          arch: ${{ runner.arch }}

      - name: Windows Choco Packages Install
        if: runner.os == 'Windows'
        run: |
          choco install sqlite $CHOC_OPS

      - name: Windows NASM Install
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: matrix.goal == 'build' && runner.os == 'Windows' && runner.arch == 'X64' && steps.cache-python-ssl.outputs.cache-hit != 'true'

      - name: Config OpenSSL
        if: matrix.goal == 'build' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        run: |
          cd "${OPENSSL_SOURCE_PATH}"
          # Fix MSVC ARM64 stack probe bug (OpenSSL PR #32872 / Issue #26239): remove /Gs0
          "${PERL}" -pi -e 's/\/Gs0 //g' Configurations/10-main.conf
          # Python doesn't like OpenSSL 4.0 with ASM on Linux/Windows arm64
          if ([ "$RUNNER_OS" == "Windows" ] && [ "$RUNNER_ARCH" == "ARM64" ]); then
            CONFIG_OPTS="${OPENSSL_CONFIG_OPTS/-O3/-O1}"
            "${PERL}" ./Configure --libdir=lib --prefix="${OPENSSL_INSTALL_PATH}" no-asm $CONFIG_OPTS
          elif ([ "$RUNNER_OS" == "Linux" ] && [ "$RUNNER_ARCH" == "ARM64" ]); then
            "${PERL}" ./Configure --libdir=lib --prefix="${OPENSSL_INSTALL_PATH}" no-asm $OPENSSL_CONFIG_OPTS
          else
            "${PERL}" ./Configure --libdir=lib --prefix="${OPENSSL_INSTALL_PATH}" $OPENSSL_CONFIG_OPTS
          fi

      - name: Rename GNU link on Windows
        if: matrix.goal == 'build' && runner.os == 'Windows' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        shell: bash
        run: mv /usr/bin/link /usr/bin/gnulink

      - name: Make OpenSSL
        if: matrix.goal == 'build' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        run: |
          cd "${OPENSSL_SOURCE_PATH}"
          $MAKE "${MAKEOPT}"

      - name: Install OpenSSL
        if: matrix.goal == 'build' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        run: |
          cd "${OPENSSL_SOURCE_PATH}"
          # install_sw saves us ages processing man pages :-)
          $MAKE install_sw

      - name: Run OpenSSL
        if: matrix.goal == 'build'
        run: |
          echo "=== 1. OpenSSL Build Info and Compiler Flags ==="
          "${OPENSSL_INSTALL_PATH}/bin/openssl" version -a
          echo "=== 2. Testing SSL_CTX and Cipher Initialization ==="
          "${OPENSSL_INSTALL_PATH}/bin/openssl" ciphers -v
          echo "=== 3. Testing Live TLS Handshake (pypi.org:443) ==="
          echo "Q" | "${OPENSSL_INSTALL_PATH}/bin/openssl" s_client -connect pypi.org:443 -servername pypi.org -state

      - name: Get latest stable Python source
        if: matrix.goal == 'build' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/python/cpython.git
          cd "${PYTHON_SOURCE_PATH}"
          export LATEST_STABLE_TAG=$(git tag --list | grep -v a | grep -v rc | grep -v b | sort -Vr | head -n1)
          git checkout "${LATEST_STABLE_TAG}"
          # Temp Python 3.14 patch to work with OpenSSL 4
          # Python 3.15 in Oct 2026 should support 4 OOB
          patch -p1 < "${GITHUB_WORKSPACE}/tools/py314-ossl4.diff"
          export COMPILED_PYTHON_VERSION=${LATEST_STABLE_TAG:1} # Trim the "v" prefix
          echo "COMPILED_PYTHON_VERSION=${COMPILED_PYTHON_VERSION}" >> $GITHUB_ENV

      - name: Mac/Linux Configure Python
        if: matrix.goal == 'build' && runner.os != 'Windows' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        run: |
          cd "${PYTHON_SOURCE_PATH}"
          ./configure --with-openssl="${OPENSSL_INSTALL_PATH}" \
                      --prefix="${PYTHON_INSTALL_PATH}" \
                      --enable-shared \
                      --with-ensurepip=upgrade \
                      --enable-optimizations \
                      --with-lto

      - name: Windows Get External Python deps
        if: matrix.goal == 'build' && runner.os == 'Windows' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          cd "${env:PYTHON_SOURCE_PATH}"
          PCBuild\get_externals.bat

      - name: Windows overwrite external OpenSSL with local
        if: matrix.goal == 'build' && runner.os == 'Windows' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          cd "${env:PYTHON_SOURCE_PATH}"
          $env:OPENSSL_EXT_PATH = "$(Get-Item externals\openssl-bin-* | Select -exp FullName)\"
          echo "External OpenSSL was downloaded to ${env:OPENSSL_EXT_PATH}"
          Remove-Item -recurse -force "${env:OPENSSL_EXT_PATH}*"
          # Emulate what this script does:
          # https://github.com/python/cpython/blob/main/PCbuild/openssl.vcxproj
          $env:OPENSSL_EXT_TARGET_PATH = "${env:OPENSSL_EXT_PATH}${env:PYEXTERNALS_PATH}"
          echo "Copying our OpenSSL to ${env:OPENSSL_EXT_TARGET_PATH}"
          mkdir "${env:OPENSSL_EXT_TARGET_PATH}\include\openssl\"
          Copy-Item -Path "${env:OPENSSL_SOURCE_PATH}\LICENSE.txt" -Destination "${env:OPENSSL_EXT_TARGET_PATH}\LICENSE" -verbose
          cp "$env:OPENSSL_INSTALL_PATH\lib\*" "${env:OPENSSL_EXT_TARGET_PATH}"
          cp "$env:OPENSSL_INSTALL_PATH\bin\*" "${env:OPENSSL_EXT_TARGET_PATH}"
          cp "$env:OPENSSL_INSTALL_PATH\include\openssl\*" "${env:OPENSSL_EXT_TARGET_PATH}\include\openssl\"
          # Copy applink.c from source ms/ folder (or install include if present)
          if (Test-Path "$env:OPENSSL_SOURCE_PATH\ms\applink.c") {
            cp "$env:OPENSSL_SOURCE_PATH\ms\applink.c" "${env:OPENSSL_EXT_TARGET_PATH}\include\"
          } elseif (Test-Path "$env:OPENSSL_INSTALL_PATH\include\openssl\applink.c") {
            cp "$env:OPENSSL_INSTALL_PATH\include\openssl\applink.c" "${env:OPENSSL_EXT_TARGET_PATH}\include\"
          }

      - name: Windows Install sphinx-build
        if: matrix.goal == 'build' && runner.os == 'Windows' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          pip install --upgrade pip
          pip install --upgrade sphinx
          sphinx-build --version

      - name: Windows Config/Build/Install Python
        if: matrix.goal == 'build' && runner.os == 'Windows' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          cd "${env:PYTHON_SOURCE_PATH}"
          # Custom openssl.props without DLL copy
          Copy-Item -Path "${env:GITHUB_WORKSPACE}\openssl.props" -Destination PCBuild\ -Verbose
          # Custom _hashlib.vcxproj with static crypto dependencies
          Copy-Item -Path "${env:GITHUB_WORKSPACE}\_hashlib.vcxproj" -Destination PCBuild\ -Verbose
          echo "Building for ${env:PYBUILDRELEASE_ARCH}..."
          PCBuild\build.bat -c Release -p "${env:PYBUILDRELEASE_ARCH}" --pgo
          .\python.bat PC\layout --precompile --preset-default --copy $env:PS_PYTHON_INSTALL_PATH
          Get-ChildItem -Path $env:PS_PYTHON_INSTALL_PATH -File

      - name: Mac/Linux Build Python
        if: matrix.goal == 'build' && runner.os != 'Windows' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        run: |
          cd "${PYTHON_SOURCE_PATH}"
          echo "Running: ${MAKE} ${MAKEOPT}"
          $MAKE $MAKEOPT

      - name: Mac/Linux Install Python
        if: matrix.goal == 'build' && runner.os != 'Windows' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        run: |
          cd "${PYTHON_SOURCE_PATH}"
          $MAKE altinstall
          $MAKE bininstall

      - name: Run Python
        run: |
          "${PYTHON}" -VV
          "${PYTHON}" -c "import ssl; print(f'Using {ssl.OPENSSL_VERSION}')"
          "${PYTHON}" -c "import hashlib; print(f'hashlib algorithms: {len(hashlib.algorithms_available)}')"
          "${PYTHON}" -c "import ctypes, zlib, bz2, lzma, sqlite3; print('ctypes, compression, sqlite3 OK')"

      - name: Create and use Python .venv
        run: |
          "$PYTHON" -m venv "${GITHUB_WORKSPACE}/.venv"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            PYTHON="${GITHUB_WORKSPACE}/.venv/Scripts/python.exe"
          else
            PYTHON="${GITHUB_WORKSPACE}/.venv/bin/python"
          fi
          echo "PYTHON=${PYTHON}" >> $GITHUB_ENV
          echo "Using VENV Python ${PYTHON}"

          # Update gyb command so test jobs use the venv Python
          # build jobs will later overwrite $gyb with the compiled binary path
          export gyb="${PYTHON} -m gyb"
          echo "gyb=${gyb}" >> $GITHUB_ENV

      - name: Install pip requirements
        run: |
          if ([ "$RUNNER_OS" == "Windows" ] && [ "$RUNNER_ARCH" == "ARM64" ]); then
            # custom cryptography wheel for win arm64 since the project doesn't provide one:
            # https://github.com/pyca/cryptography/issues/14293
            gh release download --repo "jay0lee/cryptography-wheels" --pattern "*[^t]-win_arm64.whl" --clobber
            "$PYTHON" -m pip install cryptography-*.whl
          "$PYTHON" -m pip install --upgrade -r requirements.txt

      - name: Install PyInstaller
        if: matrix.goal == 'build'
        run: |
          "${PYTHON}" -m pip install --upgrade pyinstaller
          "${PYTHON}" -m PyInstaller --version

      - name: Build GYB with PyInstaller
        if: matrix.goal == 'build'
        run: |
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            export codesign_identity="Jay Lee"
          fi
          if [[ "$staticx" != "yes" ]]; then
            export PYINSTALLER_BUILD_ONEDIR=yes
          fi
          "${PYTHON}" -m PyInstaller --clean --noconfirm --distpath=dist gyb.spec

          # In onefile mode (staticx), PyInstaller produces a single binary at dist/gyb.
          # Move it into dist/gyb/gyb so dist/gyb is always a directory across all builds.
          if [ -f "dist/gyb" ]; then
            mv dist/gyb dist/gyb_bin
            mkdir -p dist/gyb
            mv dist/gyb_bin dist/gyb/gyb
          fi

          if [ -x "$(command -v realpath)" ]; then
            realpath=realpath
          else
            brew install coreutils
            realpath=grealpath
          fi

          # gybpath is always the folder
          export gybpath=$(${realpath} dist/gyb)

          # gyb is always the executable binary inside
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            export gyb=$(cygpath -w "${gybpath}/gyb.exe")
          else
            export gyb="${gybpath}/gyb"
          fi

          echo "gybpath=${gybpath}" >> $GITHUB_ENV
          echo "gyb=${gyb}" >> $GITHUB_ENV
          echo -e "GYB: ${gyb}\nGYBPATH: ${gybpath}"

      - name: Linux install patchelf/staticx
        if: matrix.staticx == 'yes'
        run: |
          sudo apt-get -qq --yes update
          # arm64 needs to build a wheel and needs scons to build
          sudo apt-get -qq --yes install scons
          "${PYTHON}" -m pip install --upgrade patchelf-wrapper
          # "${PYTHON}" -m pip install --upgrade staticx
          # install latest github src for staticx
          "${PYTHON}" -m pip install --upgrade "git+https://github.com/JonathonReinhart/staticx"

      - name: Linux Make Static GYB
        if: matrix.staticx == 'yes'
        run: |
          case $RUNNER_ARCH in
            X64)
              ldlib=/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2
              ;;
            ARM64)
              ldlib=/lib/aarch64-linux-gnu/ld-linux-aarch64.so.1
              ;;
          esac
          echo "ldlib=${ldlib}"
          $PYTHON -m staticx -l "${ldlib}" "$gyb" "${gyb}-staticx"
          rm -f "$gyb"
          mv "${gyb}-staticx" "$gyb"

      - name: Setup Certum Code Signing
        id: certum
        if: runner.os == 'Windows'
        uses: jay0lee/certum-cloud-code-sign@a3324503499c49090869856eeeecfe95fb613d87 # v1
        with:
          username: ${{ secrets.CERTUM_USERNAME || 'jay0lee@gmail.com' }}
          totp_secret: ${{ secrets.TOTP_SECRET }}
          cert_sha1: ${{ env.WINDOWS_CODESIGN_CERT_HASH }}
          debug: 'false'

      - name: Sign Windows Binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $signtool = "${{ steps.certum.outputs.signtool-path }}"
          $thumbprint = "${{ steps.certum.outputs.cert-thumbprint }}"
          $targetDir = (Resolve-Path "dist/gyb").Path
          Write-Host "Searching for binaries to sign in $targetDir..."

          # Collect all executable files (*.exe, *.dll, *.pyd)
          $files = Get-ChildItem -Path $targetDir -Recurse -Include *.exe, *.dll, *.pyd
          $filesToSign = @()
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            if ($sig.Status -eq 'NotSigned' -or $sig.Status -eq 'HashMismatch') {
              $filesToSign += $file.FullName
            } else {
              Write-Host "Skipping $($file.Name) - Already signed by $($sig.SignerCertificate.Subject)"
            }
          }

          # Batch sign in chunks of 50 to respect Windows command line limits
          if ($filesToSign.Count -gt 0) {
            Write-Host "Batch signing $($filesToSign.Count) files..."
            $chunkSize = 50
            for ($i = 0; $i -lt $filesToSign.Count; $i += $chunkSize) {
              $upperBound = [Math]::Min($i + $chunkSize - 1, $filesToSign.Count - 1)
              $chunk = $filesToSign[$i..$upperBound]
              Write-Host "Signing chunk ($($chunk.Count) files)..."
              $baseArgs = @("sign", "/sha1", $thumbprint, "/tr", "http://time.certum.pl", "/td", "SHA256", "/fd", "SHA256", "/v")
              Start-Process -Wait -NoNewWindow -ErrorAction Stop -FilePath $signtool -ArgumentList ($baseArgs + $chunk)
            }
          } else {
            Write-Host "No files require signing."
          }

          Write-Host "Verifying primary binary signature..."
          & "$signtool" verify /pa /v "$env:gyb"

      - name: MacOS send binary for Apple notarization
        if: runner.os == 'macOS'
        env:
          APPLE_KEY: ${{ secrets.APPLE_KEY }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          # Apple wants some kind of "package" submitted so just add gyb to a .zip
          # name it something we can track and link in Apple's notarize process
          zipfilename="./gyb-${RUNNER_ARCH}-${GITHUB_RUN_ID}-${GITHUB_RUN_NUMBER}.zip"
          zip -r "$zipfilename" "$gybpath"
          export KEY_FILE="$(mktemp).p8"
          trap 'rm -f "$KEY_FILE"' EXIT
          echo "$APPLE_KEY" > "$KEY_FILE"
          xcrun notarytool submit "$zipfilename" --key "$KEY_FILE" --key-id "$APPLE_KEY_ID" --issuer "$APPLE_ISSUER_ID"
          rm -v "$KEY_FILE"
          rm -v "$zipfilename"

      - name: Attest Binary Provenance
        uses: actions/attest-build-provenance@0b6e9809265278d02c58acf52849a95818a5a306 # v3.0.0
        if: matrix.goal == 'build'
        with:
          subject-path: ${{ env.gyb }}

      - name: Basic Tests all jobs
        run: |
             echo -e "PYTHON: $PYTHON\ngyb: $gyb\ngybpath: $gybpath\n"
             touch "${gybpath}/nobrowser.txt"
             $gyb --version
             export GYBVERSION=$($gyb --short-version )
             echo "GYB Version ${GYBVERSION}"
             echo "GYBVERSION=${GYBVERSION}" >> $GITHUB_ENV
             if [ -d "gyb" ]; then
               cp LICENSE gyb/
             fi
             rm -f "${gybpath}/nobrowser.txt"
             rm -f "${gybpath}/lastcheck.txt"

      - name: Linux package GYB
        if: runner.os == 'Linux' && matrix.goal == 'build'
        run: |
          if [[ "${staticx}" == "yes" ]]; then
            this_glibc_ver="legacy"
          else
            this_glibc_ver=glibc$(ldd --version | awk '/ldd/{print $NF}')
          fi
          GYB_ARCHIVE="gyb-${GYBVERSION}-linux-$(arch)-${this_glibc_ver}.tar.xz"
          tar -cJf "$GYB_ARCHIVE" -C dist gyb

      - name: MacOS package GYB
        if: runner.os == 'macOS' && matrix.goal == 'build'
        run: |
          MACOSVERSION=$(defaults read loginwindow SystemVersionStampAsString)
          GYB_ARCHIVE="gyb-${GYBVERSION}-macos-${arch}.tar.xz"
          tar -cJf "$GYB_ARCHIVE" -C dist gyb

      - name: Windows package GYB
        if: runner.os == 'Windows' && matrix.goal == 'build'
        run: |
          # Copy setup helper and license into application directory
          cp gyb-setup.bat dist/gyb/
          cp LICENSE dist/gyb/ || true

          # Detect runner architecture using standard GHA env vars
          if [[ "${RUNNER_ARCH}" == "ARM64" ]]; then
            win_arch="arm64"
            wix_arch="arm64"
          else
            win_arch="x86_64"
            wix_arch="x64"
          fi

          # 1. Create ZIP Archive containing the top-level gyb/ folder
          GYB_ARCHIVE="${GITHUB_WORKSPACE}/gyb-${GYBVERSION}-windows-${win_arch}.zip"
          cd dist
          /c/Program\ Files/7-Zip/7z.exe a -tzip "$GYB_ARCHIVE" gyb -xr!.svn
          cd ..

          # 2. Build MSI Installer with WiX Toolset
          export MSI_FILENAME="${GITHUB_WORKSPACE}/gyb-${GYBVERSION}-windows-${win_arch}.msi"

          # Populate staging folders for WiX
          mkdir -p gyb-64 gyb
          cp -rf dist/gyb/* gyb-64/
          cp -rf dist/gyb/* gyb/

          /c/Program\ Files\ \(x86\)/WiX\ Toolset\ v3.14/bin/candle.exe -arch ${wix_arch} windows-gyb.wxs
          /c/Program\ Files\ \(x86\)/WiX\ Toolset\ v3.14/bin/light.exe -ext /c/Program\ Files\ \(x86\)/WiX\ Toolset\ v3.14/bin/WixUIExtension.dll windows-gyb.wixobj -o "$MSI_FILENAME" || true
          rm -f *.wixpdb
          echo "MSI_FILENAME=${MSI_FILENAME}" >> $GITHUB_ENV

      - name: Sign GYB MSI
        if: runner.os == 'Windows' && matrix.goal == 'build'
        shell: pwsh
        run: |
          Write-Host "Signing ${env:MSI_FILENAME}...."
          $signtool = "${{ steps.certum.outputs.signtool-path }}"
          if (-not $signtool) {
            $signtool = 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe'
          }
          $thumbprint = "${{ steps.certum.outputs.cert-thumbprint }}"
          if (-not $thumbprint) {
            $thumbprint = "$env:WINDOWS_CODESIGN_CERT_HASH"
          }

          Start-Process -Wait -NoNewWindow -ErrorAction Stop -FilePath $signtool -ArgumentList "sign", "/sha1", $thumbprint, "/tr", "http://time.certum.pl", "/td", "SHA256", "/fd", "SHA256", "/v", "$env:MSI_FILENAME"
          Write-Host "Verifying signature of ${env:MSI_FILENAME}...."
          & "$signtool" verify /pa /v "$env:MSI_FILENAME"

      - name: Attest Build Archive Provenance
        uses: actions/attest-build-provenance@0b6e9809265278d02c58acf52849a95818a5a306 # v3.0.0
        if: (github.event_name == 'push' || github.event_name == 'schedule') && matrix.goal == 'build'
        with:
          subject-path: |
            gyb*.tar.xz
            gyb*.zip
            gyb*.msi

      - name: Basic Tests build jobs only
        if: matrix.goal == 'build' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        run: |
          export voutput=$($gyb --version)
          export python_line=$(echo -e "${voutput}" | grep "Python ")
          export python_arr=($python_line)
          export this_python=${python_arr[1]}
          if [[ "${this_python}" != "${COMPILED_PYTHON_VERSION}" ]]; then
            echo "ERROR: Tried to compile Python ${COMPILED_PYTHON_VERSION} but ended up with ${this_python}"
            exit 1
          fi
          export openssl_line=$(echo -e "${voutput}" | grep "OpenSSL ")
          export openssl_arr=($openssl_line)
          export this_openssl=${openssl_arr[1]}
          if [[ "${this_openssl}" != "${COMPILED_OPENSSL_VERSION}" ]]; then
            echo "ERROR: Tried to compile OpenSSL ${COMPILED_OPENSSL_VERSION} but ended up with ${this_openssl}"
            exit 1
          fi
          echo "We successfully compiled Python ${this_python} and OpenSSL ${this_openssl}"

      - name: Live API tests push only
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.repository_owner == 'GAM-team'
        env:
          PASSCODE: ${{ secrets.PASSCODE }}
        run: |
              export gyb_user="gyb-gha-${JID}@pdl.jaylee.us"
              export gyb_group="gyb-travis-group-${JID}@pdl.jaylee.us"
              source .github/actions/decrypt.sh .github/actions/creds.tar.gpg creds.tar
              $gyb --action check-service-account --email $gyb_user
              $gyb --action purge --email $gyb_user
              $gyb --action purge-labels --email $gyb_user
              $gyb --action restore --local-folder samples/gyb-format --email $gyb_user --cleanup
              $gyb --action restore --local-folder samples/gyb-format --email $gyb_user --service-account --noresume
              $gyb --action restore-group --local-folder samples/gyb-format --email $gyb_group --use-admin $gyb_user --cleanup --cleanup-from "God of Thunder <thor@avengers.com>"
              $gyb --action restore-group --local-folder samples/gyb-format --email $gyb_group --use-admin $gyb_user --service-account --noresume
              $gyb --action restore-group --local-folder samples/google-takeout --email $gyb_group --use-admin $gyb_user
              $gyb --action restore-group --local-folder samples/vault-export-mbox --email $gyb_group --use-admin $gyb_user --service-account
              $gyb --action restore-mbox --local-folder samples/historic-public-mbox --email $gyb_user --cleanup
              $gyb --action restore-mbox --local-folder samples/historic-public-mbox --email $gyb_user --service-account --noresume
              $gyb --action restore-mbox --local-folder samples/google-takeout --email $gyb_user --cleanup --cleanup-from  "God of Thunder <thor@avengers.com>"
              $gyb --action restore-mbox --local-folder samples/vault-export-mbox --email $gyb_user
              $gyb --action count --email $gyb_user
              $gyb --action count --email $gyb_user --service-account
              $gyb --action quota --email $gyb_user
              $gyb --action quota --email $gyb_user --service-account
              $gyb --action estimate --email $gyb_user
              $gyb --action estimate --email $gyb_user --service-account
              $gyb --action print-labels --email $gyb_user
              $gyb --action print-labels --email $gyb_user --service-account
              $gyb --action backup --email $gyb_user
              $gyb --action backup --email $gyb_user --service-account --local-folder sa-backup
              $gyb --action backup-chat --email $gyb_user

      - name: Archive artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.goal == 'build'
        with:
          name: gyb-binaries-${{ env.OS }}-${{ env.arch }}-${{ matrix.jid }}
          path: |
            gyb*.tar.xz
            gyb*.zip
            gyb*.msi

      - name: Teardown SimplySign Desktop Session
        if: always() && runner.os == 'Windows'
        uses: jay0lee/certum-cloud-code-sign/teardown@a3324503499c49090869856eeeecfe95fb613d87 # v1

      - name: Tar Cache archive
        if: matrix.goal == 'build' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          tar_folder="ssl/ python/"
          tar cJvvf cache.tar.xz $tar_folder

  merge:
    if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
      packages: write
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gyb-binaries
          pattern: gyb-binaries-*

  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    needs: merge
    permissions:
      contents: write
      packages: write
      pull-requests: read

    steps:

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # 5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # 5.0.0

      - name: VirusTotal Scan
        uses: crazy-max/ghaction-virustotal@d34968c958ae283fe976efed637081b9f9dcf74f # 4.2.0
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            gyb-binaries/*

      - name: Set datetime version string
        id: dateversion
        run: |
          export dateversion="$(date  +'%Y%m%d.%H%M%S')"
          echo "Date version: ${dateversion}"
          echo "dateversion=${dateversion}" >> $GITHUB_OUTPUT

      - name: Publish draft release
        uses: softprops/action-gh-release@fbadcc90e88ecface60a0a0d123795b784ceb239 # v2.3.2
        with:
          draft: true
          prerelease: false
          tag_name: "${{ steps.dateversion.outputs.dateversion }}"
          fail_on_unmatched_files: true
          files: |
            gyb-binaries/*
